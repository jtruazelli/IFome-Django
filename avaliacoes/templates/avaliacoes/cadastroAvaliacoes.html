{% extends 'base_aluno.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/avaliacoes/avaliacao.css' %}">
{% endblock %}

{% block content %}

<!-- Formulário do Django -->
<form id="form-avaliacao" method="POST" action="{% url 'cadastrar_avaliacao' %}">
    {% csrf_token %}

    <!-- Seleção do destinatário -->
    <select name="tipo" class="form-select" required>
        <option value="" disabled selected>Selecione o tipo</option>
        <option value="1">Cardápio</option>
        <option value="2">Mensagem de carinho</option>
    </select>

    <!-- Área de comentário -->
    <div class="form-floating mt-3">
        <textarea name="mensagem" class="form-control" placeholder="Deixe seu comentário aqui" id="floatingTextarea2" required style="height: 100px;"></textarea>
        <label for="floatingTextarea2">Comentário</label>
    </div>

    <!-- Área de avaliar com estrelas -->
    <div class="estrelas mt-3">
        <ul class="avaliacao">
            <li class="star-icon ativo" data-avaliacao="1">★</li>
            <li class="star-icon" data-avaliacao="2">★</li>
            <li class="star-icon" data-avaliacao="3">★</li>
            <li class="star-icon" data-avaliacao="4">★</li>
            <li class="star-icon" data-avaliacao="5">★</li>
        </ul>
        <!-- Input oculto para enviar a nota no formulário -->
        <input type="hidden" name="nota" id="nota-input" value="1">
    </div>

    <!-- Botões -->
    <div class="d-flex gap-2 mt-3">
        <a href="{% url 'pagina_avaliacoes' %}" id="btn-voltar" class="btn btn-secondary">Voltar</a>
        <button type="submit" id="btn-publicar" class="btn btn-primary">Publicar</button>
    </div>
</form>

{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/avaliacoes.js' %}"></script>
{% endblock %}
