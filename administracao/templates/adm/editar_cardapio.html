{% extends 'base_adm.html' %}

{% block page_title %}Editar Cardápio{% endblock %}

{% block content %}
<div class="card card-adm border-0 shadow-sm">
    <div class="card-body">
        <form method="post" action="{% url 'editar_cardapio' cardapio.id %}">
            {% csrf_token %}

            <div class="mb-4">
                <label for="id_data" class="form-label fw-bold">Data do Cardápio</label>
                {{ form.data }}
            </div>

            <div class="mb-3">
                <label for="id_refeicao_manha" class="form-label fw-bold">Cardápio da Manhã</label>
                {{ form.refeicao_manha }}
            </div>

            <div class="mb-3">
                <label for="id_refeicao_almoco" class="form-label fw-bold">Cardápio do Almoço</label>
                {{ form.refeicao_almoco }}
            </div>

            <div class="mb-3">
                <label for="id_refeicao_tarde" class="form-label fw-bold">Cardápio da Tarde</label>
                {{ form.refeicao_tarde }}
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <button type="button" class="btn btn-outline-danger" onclick="if(confirm('Tem certeza que deseja excluir este cardápio?')) document.getElementById('form-excluir').submit();">
                    <i class="bi bi-trash me-1"></i> Excluir Cardápio
                </button>

                <div class="d-flex gap-2">
                    <a href="{% url 'cardapio' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary-ifome"><i class="bi bi-check-lg me-1"></i> Salvar Alterações</button>
                </div>
            </div>
        </form>

        <form id="form-excluir" action="{% url 'excluir_cardapio' cardapio.id %}" method="post" class="d-none">
            {% csrf_token %}
        </form>
    </div>
</div>
{% endblock %}
