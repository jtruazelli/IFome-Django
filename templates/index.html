{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IFome | Cardápio </title>

    <link rel="stylesheet" href="{% static 'css/base/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/cardapio/base_cardapio.css' %}">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>



<header class="cabecalho">

    <!-- Logo à esquerda -->
    <div class="cabecalho-esquerda">
        <a href="{% url 'index' %}" class="logo">
            <img src="{% static 'img/logo.png' %}" alt="Logo IFRO">
        </a>
    </div>

    <!-- Botões à direita -->
    <div class="cabecalho-direita">

        <!-- Botão para abrir a barra lateral -->
        <button
            type="button"
            id="openSidebar"
            class="btn-toggle"
            aria-label="Abrir menu">
            <i class="bi bi-list"></i>
        </button>

        <!-- Botão para mudar o tema -->
        <button
            type="button"
            id="btn-theme-toggle"
            class="btn-theme"
            aria-label="Mudar tema">
            <span id="theme-icon">🌙</span>
        </button>

        <!-- Login -->
        <a href="#" class="btn-login">
            Login
        </a>

    </div>
</header>

<!-- Barra lateral à direita -->
<nav id="sidebar" class="barra-lateral" aria-label="Navegação principal">

    <button
        type="button"
        id="closeSidebar"
        class="btn-fechar-menu"
        aria-label="Fechar menu">
        <i class="bi bi-x-lg"></i>
    </button>

    <a href="{% url 'index' %}" class="link-menu">
        <i class="bi bi-house-fill"></i>
        <span>Cardápio</span>
    </a>

    <a href="{% url 'tabela' %}" class="link-menu">
        <i class="bi bi-table"></i>
        <span>Tabela Nutricional</span>
    </a>

    <a href="#" class="link-menu">
        <i class="bi bi-star-fill"></i>
        <span>Avaliar</span>
    </a>

    <a href="#" class="link-menu">
        <i class="bi bi-info-circle-fill"></i>
        <span>Quem Somos?</span>
    </a>

</nav>

<main class="pagina-cardapio" id="conteudo-principal">

    <div class="titulo-pagina">
        <h1>CARDÁPIO - 00/00</h1>
    </div>

    <section class="cardapio-container">

        <!-- MANHÃ -->
        <article class="card-cardapio">
            <div class="card-titulo">
                <strong>MANHÃ</strong>
                <span>00/00</span>
            </div>

            <div class="card-conteudo">
                <!-- Mantenha aqui o conteúdo da manhã que você já escreveu -->
            </div>
        </article>

        <!-- ALMOÇO -->
        <article class="card-cardapio">
            <div class="card-titulo">
                <strong>ALMOÇO</strong>
                <span>00/00</span>
            </div>

            <div class="card-conteudo">
                <!-- Mantenha aqui o conteúdo do almoço -->
            </div>
        </article>

        <!-- TARDE -->
        <article class="card-cardapio">
            <div class="card-titulo">
                <strong>TARDE</strong>
                <span>00/00</span>
            </div>

            <div class="card-conteudo">
                <!-- Mantenha aqui o conteúdo da tarde -->
            </div>
        </article>

    </section>

</main>

<script src="{% static 'js/base.js' %}"></script>
<script src="{% static 'js/cardapio.js' %}"></script>
</body>
</html>
