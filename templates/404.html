{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página Não Encontrada | IFome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-erro {
            max-width: 500px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #2e7d32;
        }
        .codigo-erro {
            font-size: 4.5rem;
            font-weight: 800;
            color: #2e7d32;
            line-height: 1;
        }
        .btn-ifome {
            background-color: #2e7d32;
            color: #fff;
            border: none;
        }
        .btn-ifome:hover {
            background-color: #1b5e20;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container px-3">
        <div class="card card-erro p-4 p-md-5 text-center mx-auto bg-white">
            <div class="mb-3">
                <i class="bi bi-search text-success" style="font-size: 2.5rem;"></i>
            </div>
            <div class="codigo-erro mb-2">404</div>
            <h4 class="fw-bold text-dark mb-3">Ops! Página não encontrada</h4>
            <p class="text-muted mb-4">
                O endereço que você tentou acessar não existe ou foi movido no sistema do refeitório <strong>IFome</strong>.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="/" class="btn btn-ifome px-4 py-2">
                    <i class="bi bi-house-door me-1"></i> Voltar ao Cardápio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
